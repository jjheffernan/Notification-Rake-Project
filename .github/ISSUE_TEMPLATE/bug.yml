name: Bug report
description: Something isn't working
title: "[bug] "
labels:
  - bug
  - needs-triage
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Environment
      placeholder: docker compose / Coolify / local venv, branch or commit
    validations:
      required: false
