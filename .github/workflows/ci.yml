name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check src tests
      - run: pytest -q --tb=short

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # ponytail: upgrade pip before audit — setup-python ships an older pip with known CVEs
      - run: pip install --upgrade pip
      - run: pip install ".[dev]" pip-audit
      - run: pip-audit
        # ponytail: allow failure until baseline is clean; remove continue-on-error once green
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -f docker/Dockerfile --target app .
          docker build -f docker/Dockerfile --target jupyter .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Trigger Coolify redeploy
        if: env.COOLIFY_WEBHOOK != ''
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: curl -fsS -X POST "$COOLIFY_WEBHOOK"
